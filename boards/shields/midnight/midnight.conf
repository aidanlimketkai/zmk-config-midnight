# --- Pointing / HID ---
CONFIG_ZMK_POINTING=y
# High-resolution (smooth) wheel reports. Remove if your ZMK revision lacks it.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- AS5600 driver ---
CONFIG_ZMK_INPUT_AMS_AS5600=y
CONFIG_ZMK_INPUT_AMS_AS5600_POLL_INTERVAL=10      # ms, default 20. Lower = lower latency
CONFIG_ZMK_INPUT_AMS_AS5600_POWER_MODE_NOM=y      # always-on sensor, fastest response

# Precision tuning (starting point):
# Heavy slow filter removes jitter while slow-turning; the fast-filter
# threshold lets quick spins bypass it so the wheel still feels responsive.
CONFIG_ZMK_INPUT_AMS_AS5600_SLOW_FILTER_16X=y
CONFIG_ZMK_INPUT_AMS_AS5600_FAST_FILTER_THRESHOLD_10LSB=y
CONFIG_ZMK_INPUT_AMS_AS5600_HYSTERESIS_1LSB=y

# Set to y ONCE while adjusting magnet height, aim for AGC mid-range
# (~64 in 3.3 V mode), then turn off again.
CONFIG_ZMK_INPUT_AMS_AS5600_LOG_AGC=n

# Handy for first bring-up; remove after
# CONFIG_ZMK_USB_LOGGING=y
